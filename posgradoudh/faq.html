<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UDH - Preguntas Frecuentes</title>
  <link rel="icon" href="assets/img/icon.png?v=2" type="image/png">
  <link rel="shortcut icon" href="assets/img/icon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css" />


  <style>
    body{ background:#faf7f0; }

    #navbar{ transition: all .3s ease; }
    #navbar.is-scrolled{
      background: rgba(250,247,240,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(61,60,59,0.16);
    }

    .docs-link{
      display:block;
      padding:10px 12px;
      border-radius:14px;
      font-weight:700;
      color:rgba(255,255,255,.75);
      transition:all .2s ease;
      cursor: pointer;
    }
    .docs-link:hover{
      background:rgba(255,255,255,.1);
      color:#fff;
      transform:translateX(3px);
    }
    .docs-link.is-active{
      background:rgba(236,193,56,.25);
      color:#fff;
    }

    .viewer{
      border-radius:24px;
      overflow:hidden;
      background:white;
      box-shadow:0 12px 30px rgba(0,0,0,.1);
      border:1px solid rgba(61,60,59,.16);
      min-height:600px;
      transition:all .25s ease;
    }
    .viewer iframe{
      width:100%;
      height:650px;
      border:0;
    }
    .placeholder{
      height:650px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:rgba(61,60,59,.6);
    }

    /* MOBILE DROPDOWN */
    .mobile-nav-select {
      display: none;
      position: relative;
      margin-bottom: 24px;
    }

    .mobile-nav-btn {
      width: 100%;
      padding: 14px 18px;
      background: #3d3c3b;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .mobile-nav-btn .chevron {
      font-size: 18px;
      transition: transform 0.2s ease;
      opacity: 0.7;
    }
    .mobile-nav-btn .chevron.open {
      transform: rotate(180deg);
    }

    .mobile-nav-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #3d3c3b;
      border-radius: 14px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    }
    .mobile-nav-menu.is-open {
      display: block;
    }

    .mobile-nav-option {
      display: block;
      width: 100%;
      padding: 13px 18px;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .mobile-nav-option:last-child { border-bottom: none; }
    .mobile-nav-option:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .mobile-nav-option.is-active { background: rgba(236,193,56,0.22); color: #fff; }

    @media (max-width: 1023px) {
      .mobile-nav-select { display: block; }
    }
  </style>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
</head>

<body class="font-sans text-foreground">

  <div id="navbar-container"></div>

  <main>
    <section class="grid lg:grid-cols-[340px_1fr] min-h-screen">

      <!-- SIDEBAR desktop -->
      <aside class="hidden lg:flex flex-col justify-between
              bg-[#3d3c3b] text-white p-10
              sticky top-[75px]
              h-[calc(100vh-75px)]
              overflow-y-auto">
        <div>
          <p class="text-xs tracking-widest text-white/50">REPOSITORIO</p>
          <h2 class="text-3xl font-extrabold mt-4">Documentos<br>Posgrado</h2>

          <nav id="docsNav" class="mt-8 space-y-1">
            <a class="docs-link" data-pdf="./assets/pdf/faq/faq_maestria_doctorado.pdf">
              Maestrías y Doctorado | Segunda Especialidad
            </a>
          </nav>
        </div>

        <div class="mt-10">
          <p class="text-xs text-white/50">© 2026 universidad de huánuco — posgrado</p>
        </div>
      </aside>

      <!-- VISOR -->
      <div class="pt-24 p-6 lg:p-10 max-w-5xl">
        <h1 class="text-5xl font-extrabold">Preguntas Frecuentes</h1>
        <div class="w-16 h-2 bg-[#5A9E8D] rounded mt-4"></div>

        <!-- DROPDOWN MÓVIL -->
        <div class="mobile-nav-select mt-8" id="mobileFaqNav">
          <button class="mobile-nav-btn" id="mobileFaqBtn" type="button">
            <span id="mobileFaq_label">Selecciona un documento</span>
            <span class="chevron" id="mobileFaq_chevron">▾</span>
          </button>
          <div class="mobile-nav-menu" id="mobileFaq_menu">
            <button class="mobile-nav-option" data-pdf="./assets/pdf/faq/faq_maestria_doctorado.pdf">
              Maestrías y Doctorado | Segunda Especialidad
            </button>
          </div>
        </div>

        <div class="mt-6 lg:mt-10 viewer">
          <div id="pdfcontainer" data-accent="#5a9e8d" data-open-bg="#3d3c3b" data-radius="16px" style="width:100%; height:75vh; min-height:520px; display:flex; align-items:center; justify-content:center; text-align:center; color:rgba(61,60,59,.6);">
            <div>
              <p style="font-weight:800; font-size:18px;">Sin documento seleccionado</p>
              <p style="margin-top:8px;">Haz click en un documento del panel izquierdo</p>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <div id="footer-container"></div>


  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
